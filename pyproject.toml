[project]
name = "second-brain-settings"
version = "0.2.0"
description = "Shared local memory for AI assistants, with a native macOS app and read-only MCP"
readme = "README.md"
license = "MIT"
keywords = ["macos", "mcp", "memory", "sqlite", "codex", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Swift",
  "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "keyring>=25,<27",
  "certifi>=2025.1.31",
  "mcp>=2.3,<3",
  "pyrage==1.4.0",
]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["brain_settings"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["brain_settings"]
