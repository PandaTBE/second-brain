name: Build release draft

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: false
      - name: Install locked build and test dependencies
        run: uv sync --frozen --group build --group dev
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          .venv/bin/python - <<'PY'
          import os, re, subprocess, tomllib
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag) or tag != "v" + version:
              raise SystemExit("The tag must match the project version")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tagged = subprocess.check_output(["git", "rev-parse", "refs/tags/" + tag + "^{commit}"], text=True).strip()
          if tagged != commit:
              raise SystemExit("Checkout does not match the selected tag")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\ncommit={commit}\n")
          PY
      - name: Check public sources and run tests
        run: |
          .venv/bin/python scripts/check_public_release.py
          .venv/bin/ruff check brain_settings tests scripts launch.py
          .venv/bin/python -m pytest --cov=brain_settings --cov-report=term-missing
          swift run --package-path native SecondBrainCoreChecks
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check graph and static interface behavior
        run: node --test tests/test-*.mjs
      - name: Build portable app archive
        run: ./scripts/build-release.sh
      - name: Verify portable app and isolated runtime
        run: |
          .venv/bin/python scripts/check_release_bundle.py --app "build/release/app/Second Brain.app"
          .venv/bin/python scripts/smoke_release.py --app "build/release/app/Second Brain.app"
          .venv/bin/python scripts/smoke_local_model.py --app "build/release/app/Second Brain.app"
      - name: Prepare source archive and release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          git archive --format=zip --prefix="second-brain-${version}/" --output="dist/second-brain-${version}-source.zip" HEAD
          shasum -a 256 "dist/second-brain-${version}-source.zip" | sed 's|dist/||' >> dist/SHA256SUMS
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          base = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/blob/" + tag + "/"
          text = Path("docs/releases/" + tag[1:] + ".md").read_text()
          for relative, target in (
              ("../user-guide.en.md", "docs/user-guide.en.md"),
              ("../user-guide.ru.md", "docs/user-guide.ru.md"),
              ("../../SECURITY.md", "SECURITY.md"),
          ):
              text = text.replace("](" + relative + ")", "](" + base + target + ")")
          Path("dist/RELEASE_NOTES.md").write_text(text)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-release-assets
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checked-release-assets
          path: assets
      - name: Create a draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        working-directory: assets
        run: |
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; review it manually instead of replacing assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS --verify-tag --target "$RELEASE_COMMIT" --title "Second Brain ${RELEASE_TAG}" --notes-file RELEASE_NOTES.md --draft
